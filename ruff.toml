# Repo-wide Ruff configuration.
#
# This file exists so the enforced rule set is declared rather than inherited
# from whatever Ruff's built-in defaults happen to be. Every Python package
# here (the seven with a pyproject.toml, plus pipeline/redis which has none)
# resolves to this file by ancestor lookup, so CI, `make lint` and local runs
# all enforce the same rules.
#
# The selection below is Ruff's historical default set. Ruff 0.16.0 widened its
# built-in defaults, which silently turned ~482 new violations into CI failures
# across every Python service with no code change. Pair any change here with the
# pinned `ruff==` version in each package's dev dependencies; see
# docs/dependency-policy.md.

[lint]
select = ["E4", "E7", "E9", "F"]
